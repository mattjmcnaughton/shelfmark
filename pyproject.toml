[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shelfmark"
version = "0.1.0"
description = "A keyboard-first personal reading desk"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Matt McNaughton", email = "3269376+mattjmcnaughton@users.noreply.github.com" },
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
    "aiohttp>=3.14.5",
    "feedparser>=6.0.14",
    "readability-lxml>=0.9",
    "lxml-html-clean>=0.4.6",
    "pyjwt[crypto]>=2.15.1",
    "cryptography>=50.0.2",
]

[project.urls]
Repository = "https://github.com/mattjmcnaughton/shelfmark"

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "lxml-stubs>=0.5.1",
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.12,<0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external: tests that hit external services",
]
