name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-expensive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src/shelfmark/web/frontend

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Run gate-expensive
        run: just gate-expensive

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      SHELFMARK_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run database tests on Postgres
        run: uv run pytest tests/integration tests/e2e -m "not external"
